name: Wochit
description: >-
  Wochit is an enterprise-grade, cloud-based video creation platform that helps
  organizations produce professional, on-brand videos at scale. It offers three
  products: Studio, an AI-powered video creation workspace paired with one of
  the world's largest licensed content libraries; Frame, a white-label,
  embeddable video editor that SaaS platforms and marketplaces integrate into
  their own products; and WAVE, an automated video engine that mass-produces
  videos from templates and data. Wochit serves media companies, publishers,
  nonprofits, and enterprises that need repeatable, high-volume video
  production. Wochit does not currently publish a public developer API or
  developer portal; this profile captures its identity and security posture.
